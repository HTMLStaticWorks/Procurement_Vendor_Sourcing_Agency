<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login — Nexolve Technologies | Procurement Intelligence</title>
  <meta name="description" content="Access the Nexolve Technologies enterprise client portal to track active RFQs, compare supplier quotes, review purchase orders, and monitor spend analytics.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body style="min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding: clamp(24px, 4vw, 48px) var(--container-padding-x); position:relative;">

  <!-- Fixed Screen Top Controls (Back to Home in Left Corner, RTL & Theme Toggle in Right Corner) -->
  <a href="index.html" class="header-control-btn auth-corner-back" style="position:fixed; top:20px; left:24px; z-index:100;" title="Back to Homepage">
    ← Back to Home
  </a>

  <div class="auth-corner-controls" style="position:fixed; top:20px; right:24px; display:flex; gap:8px; z-index:100;">
    <button class="header-control-btn rtl-toggle-btn" id="rtlToggleBtn" aria-label="Toggle RTL / LTR layout" title="Toggle RTL Direction">
      <svg class="rtl-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 8h14M15 4l4 4-4 4M19 16H5M9 12l-4 4 4 4"/>
      </svg>
      <span class="rtl-label">RTL</span>
    </button>
    <button class="header-control-btn theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Light / Dark mode">
      <span class="theme-toggle-icon">🌙</span>
    </button>
  </div>

  <!-- Login Card Container -->
  <main style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; margin:auto 0; padding-top:40px;">
    
    <!-- Centered Clickable Brand Logo -->
    <a href="index.html" class="brand-lockup" style="display:inline-flex; align-items:center; justify-content:center; margin:0 auto 24px; text-decoration:none;" title="Nexolve Technologies Home">
      <svg viewBox="0 0 96 96" aria-hidden="true" focusable="false" class="matrix-mark brand-lockup__mark" style="width:44px; height:44px;">
        <g fill="none">
          <circle class="matrix-mark__ring matrix-mark__ring--outer" cx="48" cy="48" r="38" stroke-width="8" stroke-dasharray="3 10.264"></circle>
          <circle class="matrix-mark__ring matrix-mark__ring--middle" cx="48" cy="48" r="27" stroke-width="6" stroke-dasharray="2.5 8.81"></circle>
          <circle class="matrix-mark__ring matrix-mark__ring--inner" cx="48" cy="48" r="17" stroke-width="4" stroke-dasharray="2 6.901"></circle>
        </g>
        <circle class="matrix-mark__core" cx="48" cy="48" r="5"></circle>
      </svg>
      <span class="brand-lockup__rule" aria-hidden="true" style="margin:0 12px;"></span>
      <div class="brand-lockup__type" style="text-align:left;">
        <span class="brand-lockup__name" style="font-size:1.3rem;">NEXOLVE</span>
        <span class="brand-lockup__descriptor" style="font-size:0.68rem; letter-spacing:0.16em;">TECHNOLOGIES</span>
      </div>
    </a>

    <div class="card auth-card" style="max-width:460px; width:100%; padding: clamp(24px, 4vw, 40px);">
      <div style="text-align:center; margin-bottom: clamp(20px, 3.5vw, 28px);">
        <div class="section-label copper" style="margin-bottom:12px;">Institutional Access</div>
        <h1 style="font-size: clamp(1.4rem, 3vw, 1.8rem); margin-bottom:6px;">Sign In to Portal</h1>
        <p style="font-size:0.88rem; color:var(--text-secondary);">Access your company's live RFQs & supplier scorecards</p>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Enterprise Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="procurement@enterprise.com" value="m.sterling@enterprise-corp.com" required>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="form-label" for="loginPass" style="margin-bottom:0;">Password</label>
            <a href="#" style="font-size:0.75rem; color:var(--color-copper-hover); font-family:var(--font-mono);">Forgot?</a>
          </div>
          <input type="password" id="loginPass" class="form-control" value="••••••••••••" required>
        </div>

        <div style="display:flex; align-items:center; gap:8px; margin-bottom:24px; font-size:0.85rem; color:var(--text-secondary);">
          <input type="checkbox" id="rememberMe" checked>
          <label for="rememberMe">Remember active enterprise session</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-bottom:12px;">
          Authenticate & Enter Dashboard →
        </button>

        <button type="button" class="btn btn-secondary btn-sm" style="width:100%;" onclick="quickDemoLogin()">
          ⚡ Quick Demo Login (Marcus Sterling)
        </button>
      </form>

      <div style="margin-top:24px; text-align:center; font-size:0.85rem; color:var(--text-muted); border-top:1px solid rgba(255,255,255,0.06); padding-top:18px;">
        New enterprise procurement client? <br>
        <a href="register.html" class="mono text-gold" style="font-weight:700;">Create Enterprise Portal Account →</a>
      </div>
    </div>

    <!-- Security & Encryption Sub-caption -->
    <div style="margin-top:20px; text-align:center; font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono);">
      🔒 Nexolve TLS 1.3 End-to-End Enterprise Encryption
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      if (window.showToast) {
        window.showToast('Authentication successful. Redirecting to Client Dashboard...', 'success');
      }
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 600);
    }

    function quickDemoLogin() {
      document.getElementById('loginEmail').value = 'm.sterling@enterprise-corp.com';
      document.getElementById('loginPass').value = 'secure_enterprise_pass';
      if (window.showToast) {
        window.showToast('Demo Credentials Loaded for Marcus Sterling (Head of Procurement)', 'success');
      }
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 600);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Portal Registration — Nexolve Technologies | Client Onboarding</title>
  <meta name="description" content="Register your enterprise procurement organization for the Nexolve client portal to initiate supplier bidding, RFQ benchmarking, and automated contract tracking.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body style="min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding: clamp(24px, 4vw, 48px) var(--container-padding-x); position:relative;">

  <!-- Fixed Screen Top Controls (Back to Home in Left Corner, RTL & Theme Toggle in Right Corner) -->
  <a href="index.html" class="header-control-btn auth-corner-back" style="position:fixed; top:20px; left:24px; z-index:100;" title="Back to Homepage">
    ← Back to Home
  </a>

  <div class="auth-corner-controls" style="position:fixed; top:20px; right:24px; display:flex; gap:8px; z-index:100;">
    <button class="header-control-btn rtl-toggle-btn" id="rtlToggleBtn" aria-label="Toggle RTL / LTR layout" title="Toggle RTL Direction">
      <svg class="rtl-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 8h14M15 4l4 4-4 4M19 16H5M9 12l-4 4 4 4"/>
      </svg>
      <span class="rtl-label">RTL</span>
    </button>
    <button class="header-control-btn theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Light / Dark mode">
      <span class="theme-toggle-icon">🌙</span>
    </button>
  </div>

  <!-- Register Card Container -->
  <main style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; margin:auto 0; padding-top:40px;">
    
    <!-- Centered Clickable Brand Logo -->
    <a href="index.html" class="brand-lockup" style="display:inline-flex; align-items:center; justify-content:center; margin:0 auto 24px; text-decoration:none;" title="Nexolve Technologies Home">
      <svg viewBox="0 0 96 96" aria-hidden="true" focusable="false" class="matrix-mark brand-lockup__mark" style="width:44px; height:44px;">
        <g fill="none">
          <circle class="matrix-mark__ring matrix-mark__ring--outer" cx="48" cy="48" r="38" stroke-width="8" stroke-dasharray="3 10.264"></circle>
          <circle class="matrix-mark__ring matrix-mark__ring--middle" cx="48" cy="48" r="27" stroke-width="6" stroke-dasharray="2.5 8.81"></circle>
          <circle class="matrix-mark__ring matrix-mark__ring--inner" cx="48" cy="48" r="17" stroke-width="4" stroke-dasharray="2 6.901"></circle>
        </g>
        <circle class="matrix-mark__core" cx="48" cy="48" r="5"></circle>
      </svg>
      <span class="brand-lockup__rule" aria-hidden="true" style="margin:0 12px;"></span>
      <div class="brand-lockup__type" style="text-align:left;">
        <span class="brand-lockup__name" style="font-size:1.3rem;">NEXOLVE</span>
        <span class="brand-lockup__descriptor" style="font-size:0.68rem; letter-spacing:0.16em;">TECHNOLOGIES</span>
      </div>
    </a>

    <div class="card auth-card" style="max-width:540px; width:100%; padding: clamp(24px, 4vw, 40px);">
      <div style="text-align:center; margin-bottom: clamp(20px, 3.5vw, 28px);">
        <div class="section-label copper" style="margin-bottom:12px;">Enterprise Portal Onboarding</div>
        <h1 style="font-size: clamp(1.4rem, 3vw, 1.8rem); margin-bottom:6px;">Register Client Account</h1>
        <p style="font-size:0.88rem; color:var(--text-secondary);">Unlock multi-supplier bidding & live quote scoring</p>
      </div>

      <form onsubmit="handleRegister(event)">
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="regFirstName">First Name *</label>
            <input type="text" id="regFirstName" class="form-control" placeholder="Marcus" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regLastName">Last Name *</label>
            <input type="text" id="regLastName" class="form-control" placeholder="Sterling" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regCompany">Enterprise / Company Name *</label>
          <input type="text" id="regCompany" class="form-control" placeholder="Apex Industrial Manufacturing Ltd." required>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="regEmail">Work Email *</label>
            <input type="email" id="regEmail" class="form-control" placeholder="m.sterling@apex.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regSpend">Annual Sourcing Spend *</label>
            <select id="regSpend" class="form-control" required>
              <option value="$1M - $5M">$1M - $5M</option>
              <option value="$5M - $20M" selected>$5M - $20M</option>
              <option value="$20M - $100M+">$20M - $100M+</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPass">Secure Password *</label>
          <input type="password" id="regPass" class="form-control" placeholder="Min. 8 characters with numbers" required>
        </div>

        <div style="display:flex; align-items:flex-start; gap:8px; margin-bottom:24px; font-size:0.8rem; color:var(--text-secondary);">
          <input type="checkbox" id="termsCheck" required style="margin-top:3px;">
          <label for="termsCheck">I agree to the Enterprise Master Terms and confidential procurement data handling policies.</label>
        </div>

        <button type="submit" class="btn btn-gold btn-lg" style="width:100%;">
          Create Enterprise Portal Account →
        </button>
      </form>

      <div style="margin-top:24px; text-align:center; font-size:0.85rem; color:var(--text-muted); border-top:1px solid rgba(255,255,255,0.06); padding-top:18px;">
        Already registered? <br>
        <a href="login.html" class="mono text-copper-bright" style="font-weight:700;">Sign in to Existing Account →</a>
      </div>
    </div>

    <!-- Security & Encryption Sub-caption -->
    <div style="margin-top:20px; text-align:center; font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono);">
      🔒 Nexolve Enterprise TLS 1.3 Encryption • SOC 2 Type II Certified
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      const first = document.getElementById('regFirstName').value;
      const comp = document.getElementById('regCompany').value;
      if (window.showToast) {
        window.showToast(`Enterprise account initialized for ${first} (${comp})! Entering Portal...`, 'success');
      }
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 700);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Portal Registration — Nexolve Technologies | Client Onboarding</title>
  <meta name="description" content="Register your enterprise procurement organization for the Nexolve client portal to initiate supplier bidding, RFQ benchmarking, and automated contract tracking.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body style="min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding: clamp(24px, 4vw, 48px) var(--container-padding-x); position:relative;">

  <!-- Fixed Screen Top Controls (RTL & Theme Toggle in Right Corner) -->
  <div class="auth-corner-controls" style="position:fixed; top:20px; right:24px; display:flex; gap:8px; z-index:100;">
    <button class="header-control-btn rtl-toggle-btn" id="rtlToggleBtn" aria-label="Toggle RTL / LTR layout" title="Toggle RTL Direction">
      <svg class="rtl-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 8h14M15 4l4 4-4 4M19 16H5M9 12l-4 4 4 4"/>
      </svg>
      <span class="rtl-label">RTL</span>
    </button>
    <button class="header-control-btn theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Light / Dark mode">
      <span class="theme-toggle-icon">🌙</span>
    </button>
  </div>

  <!-- Register Card Container -->
  <main style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; margin:auto 0; padding:20px 0;">
    
    <div class="card auth-card" style="max-width:500px; width:100%; padding: clamp(24px, 4vw, 40px);">
      
      <!-- Brand Logo Inside Card -->
      <div style="text-align:center; margin-bottom:20px;">
        <a href="index.html" class="brand-lockup" style="display:inline-flex; align-items:center; justify-content:center; text-decoration:none;" title="Nexolve Technologies Home">
          <svg viewBox="0 0 96 96" aria-hidden="true" focusable="false" class="matrix-mark brand-lockup__mark" style="width:40px; height:40px;">
            <g fill="none">
              <circle class="matrix-mark__ring matrix-mark__ring--outer" cx="48" cy="48" r="38" stroke-width="8" stroke-dasharray="3 10.264"></circle>
              <circle class="matrix-mark__ring matrix-mark__ring--middle" cx="48" cy="48" r="27" stroke-width="6" stroke-dasharray="2.5 8.81"></circle>
              <circle class="matrix-mark__ring matrix-mark__ring--inner" cx="48" cy="48" r="17" stroke-width="4" stroke-dasharray="2 6.901"></circle>
            </g>
            <circle class="matrix-mark__core" cx="48" cy="48" r="5"></circle>
          </svg>
          <span class="brand-lockup__rule" aria-hidden="true" style="margin:0 10px; height:24px;"></span>
          <div class="brand-lockup__type" style="text-align:left;">
            <span class="brand-lockup__name" style="font-size:1.15rem;">NEXOLVE</span>
            <span class="brand-lockup__descriptor" style="font-size:0.62rem; letter-spacing:0.14em;">TECHNOLOGIES</span>
          </div>
        </a>
      </div>

      <div style="text-align:center; margin-bottom: clamp(18px, 3vw, 24px);">
        <div class="section-label copper" style="margin-bottom:8px;">Enterprise Onboarding</div>
        <h1 style="font-size: clamp(1.35rem, 2.5vw, 1.65rem); margin-bottom:6px;">Register Client Account</h1>
        <p style="font-size:0.85rem; color:var(--text-secondary);">Unlock multi-supplier bidding & live quote scoring</p>
      </div>

      <!-- Social Quick Signup Buttons -->
      <div class="social-auth-grid" style="margin-bottom:16px;">
        <button type="button" class="social-auth-btn" onclick="socialRegister('Google')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          <span>Google</span>
        </button>
        <button type="button" class="social-auth-btn" onclick="socialRegister('Apple')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.64 1.35-.58.66-1.08 1.73-.95 2.76 1.01.08 2.03-.51 2.66-1.26z"/></svg>
          <span>Apple</span>
        </button>
      </div>

      <div class="auth-divider">
        <span>OR REGISTER WITH WORK EMAIL</span>
      </div>

      <!-- Vertical One-by-One Form Inputs -->
      <form onsubmit="handleRegister(event)">
        <!-- 1. First Name -->
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" for="regFirstName" style="display:block; text-align:left; margin-bottom:6px;">First Name *</label>
          <input type="text" id="regFirstName" class="form-control" placeholder="Marcus" required>
        </div>

        <!-- 2. Last Name -->
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" for="regLastName" style="display:block; text-align:left; margin-bottom:6px;">Last Name *</label>
          <input type="text" id="regLastName" class="form-control" placeholder="Sterling" required>
        </div>

        <!-- 3. Company Name -->
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" for="regCompany" style="display:block; text-align:left; margin-bottom:6px;">Enterprise / Company Name *</label>
          <input type="text" id="regCompany" class="form-control" placeholder="Apex Industrial Manufacturing Ltd." required>
        </div>

        <!-- 4. Work Email -->
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" for="regEmail" style="display:block; text-align:left; margin-bottom:6px;">Work Email *</label>
          <input type="email" id="regEmail" class="form-control" placeholder="m.sterling@apex.com" required>
        </div>

        <!-- 5. Annual Sourcing Spend -->
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" for="regSpend" style="display:block; text-align:left; margin-bottom:6px;">Annual Sourcing Spend *</label>
          <select id="regSpend" class="form-control" required>
            <option value="$1M - $5M">$1M - $5M</option>
            <option value="$5M - $20M" selected>$5M - $20M</option>
            <option value="$20M - $100M+">$20M - $100M+</option>
          </select>
        </div>

        <!-- 6. Password with Eye Toggle -->
        <div class="form-group" style="margin-bottom:18px;">
          <label class="form-label" for="regPass" style="display:block; text-align:left; margin-bottom:6px;">Secure Password *</label>
          <div class="password-field-wrap">
            <input type="password" id="regPass" class="form-control" placeholder="Min. 8 characters with numbers" required>
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('regPass', this)">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <!-- Terms Agreement Checkbox -->
        <div style="display:flex; align-items:flex-start; gap:8px; margin-bottom:20px; font-size:0.8rem; color:var(--text-secondary);">
          <input type="checkbox" id="termsCheck" required style="margin-top:3px;">
          <label for="termsCheck" style="cursor:pointer;">I agree to the Enterprise Master Terms and confidential procurement data policies.</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-gold btn-lg" style="width:100%;">
          Create Enterprise Portal Account →
        </button>
      </form>

      <div style="margin-top:20px; text-align:center; font-size:0.85rem; color:var(--text-muted); border-top:1px solid rgba(255,255,255,0.06); padding-top:16px;">
        Already registered? <br>
        <a href="login.html" class="mono text-copper-bright" style="font-weight:700;">Sign in to Existing Account →</a>
      </div>
    </div>

    <!-- Security & Encryption Sub-caption -->
    <div style="margin-top:18px; text-align:center; font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono);">
      🔒 Nexolve Enterprise TLS 1.3 Encryption • SOC 2 Type II Certified
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      const first = document.getElementById('regFirstName').value;
      if (window.showToast) {
        window.showToast(`Enterprise account created for ${first}! Initializing portal profile...`, 'success');
      }
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 700);
    }

    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (!input) return;
      const eyeOpen = btn.querySelector('.eye-open');
      const eyeClosed = btn.querySelector('.eye-closed');
      
      if (input.type === 'password') {
        input.type = 'text';
        if (eyeOpen) eyeOpen.style.display = 'none';
        if (eyeClosed) eyeClosed.style.display = 'block';
      } else {
        input.type = 'password';
        if (eyeOpen) eyeOpen.style.display = 'block';
        if (eyeClosed) eyeClosed.style.display = 'none';
      }
    }

    function socialRegister(provider) {
      if (window.showToast) {
        window.showToast(`Connecting to ${provider} Enterprise Onboarding...`, 'info');
      }
      setTimeout(() => {
        if (window.showToast) {
          window.showToast(`${provider} Identity Verified. Creating Enterprise Account...`, 'success');
        }
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      }, 700);
    }
  </script>
</body>
</html>
